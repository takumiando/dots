setw -g mode-keys vi

unbind C-b
bind C-t send-prefix
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi C-S-c send-keys -X copy-pipe-no-clear "wl-copy"
bind -T copy-mode-vi C-S-C send-keys -X copy-pipe-no-clear "wl-copy"

bind '1' select-window -t 1
bind '2' select-window -t 2
bind '3' select-window -t 3
bind '4' select-window -t 4
bind '5' select-window -t 5
bind '6' select-window -t 6
bind '7' select-window -t 7
bind '8' select-window -t 8
bind '9' select-window -t 9
bind '0' select-window -t 10

bind '!' swap-window -t 1 \; select-window -t 1
bind '@' swap-window -t 2 \; select-window -t 2
bind '#' swap-window -t 3 \; select-window -t 3
bind '$' swap-window -t 4 \; select-window -t 4
bind '%' swap-window -t 5 \; select-window -t 5
bind '^' swap-window -t 6 \; select-window -t 6
bind '&' swap-window -t 7 \; select-window -t 7
bind '*' swap-window -t 8 \; select-window -t 8
bind '(' swap-window -t 9 \; select-window -t 9
bind ')' swap-window -t 10 \; select-window -t 10

bind n new-window
bind - split-window -v -c '#{pane_current_path}'
bind \\ split-window -h -c  '#{pane_current_path}'
bind f resize-pane -Z
bind -r C-p select-window -t :+
bind -r C-o select-window -t :-
# Expand the window ID before swapping so selection follows the same window.
bind -r P run -C 'swap-window -s #{window_id} -t :+; select-window -t #{window_id}'
bind -r O run -C 'swap-window -s #{window_id} -t :-; select-window -t #{window_id}'
bind -n C-p select-pane -t :.+
bind -n C-o select-pane -t :.-
bind r source-file ~/.tmux.conf \; display 'Configuration updated!'

# Move the current pane by swapping with its neighbour until Enter is pressed.
# Re-enter the table before swapping so it stays active even with no neighbour.
bind space switch-client -T pane-move \; refresh-client
bind -T pane-move Left  switch-client -T pane-move \; swap-pane -s '{left-of}'
bind -T pane-move Down  switch-client -T pane-move \; swap-pane -s '{down-of}'
bind -T pane-move Up    switch-client -T pane-move \; swap-pane -s '{up-of}'
bind -T pane-move Right switch-client -T pane-move \; swap-pane -s '{right-of}'
bind -T pane-move h switch-client -T pane-move \; swap-pane -s '{left-of}'
bind -T pane-move j switch-client -T pane-move \; swap-pane -s '{down-of}'
bind -T pane-move k switch-client -T pane-move \; swap-pane -s '{up-of}'
bind -T pane-move l switch-client -T pane-move \; swap-pane -s '{right-of}'
bind -T pane-move C-p switch-client -T pane-move \; swap-pane -s :.+
bind -T pane-move C-o switch-client -T pane-move \; swap-pane -s :.-
bind -T pane-move Enter  switch-client -T root \; refresh-client
bind -T pane-move Escape switch-client -T root \; refresh-client
bind -T pane-move q switch-client -T root \; refresh-client
bind -T pane-move Any switch-client -T pane-move

set -g prefix C-t
set -g mouse off
set -g repeat-time 300
set -g base-index 1
set -sg escape-time 0
set -g renumber-windows on
set -g history-limit 100000
set -g allow-passthrough on

set -g @active    '#ffffff,bold'
set -g @inactive  '#404040,bold'
set -g @info      'red,bold'
set -g @warn      'yellow,bold'
set -g status-style 'bg=default,fg=#{@active}'
set -g pane-border-style 'fg=#{@inactive}'
set -g pane-active-border-style 'fg=#{?#{==:#{client_key_table},pane-move},#{@warn},#{@active}}'
set -g message-style 'align=centre,bg=default,fg=#{@warn}'
set -g window-status-style 'bg=default,fg=#{@inactive}'
set -g window-status-current-style 'bg=default,fg=#{@active}'
set -g mode-style 'bg=#{@info},fg=default'
set -g window-status-format '#I  '
set -g window-status-current-format '#I  '
set -g status-left ''
set -g status-right '###S'
